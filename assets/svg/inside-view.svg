<?xml version="1.0" encoding="UTF-8"?>
<svg id="pc-view"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 680 720"
  role="img"
  aria-labelledby="svg-title"
  aria-describedby="svg-description visual-text">
  <title id="svg-title">Schnittansicht des zusammengestellten PCs</title>
  <desc id="svg-description">Die gewählten Komponenten werden maßstäblich angenähert im Gehäuse dargestellt.</desc>

  <!-- Grundfarben und Effekte können direkt in Inkscape oder einem Texteditor bearbeitet werden. -->
  <defs>
    <linearGradient id="caseMetal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172b42"/>
      <stop offset="1" stop-color="#091523"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#183e42"/>
      <stop offset="1" stop-color="#10272f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#496078"/>
    </pattern>
  </defs>

  <rect id="inside-canvas" width="680" height="720" fill="transparent"/>

  <!-- Diese Ebene wird von app.js entsprechend der aktuellen Auswahl befüllt. -->
  <g id="inside-content" data-editable-layer="dynamic-components"/>
</svg>
