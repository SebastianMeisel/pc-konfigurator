name: GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Anwendung prüfen
        run: |
          node --check app.js
          node --check education.js
          node --check evaluation.js
          node --check quiz.js
          node --check quiz-check.js
          node --check scorm.js
          node --check scorm-check.js
          node --check a11y-check.js
          node scorm-check.js
          node quiz-check.js
          node a11y-check.js
          python3 -m py_compile tools/quiz_xlsx.py tools/package_scorm.py
          python3 tools/package_scorm.py --force
          unzip -t dist/buildbench-scorm-1.2.zip
          test -s index.html
          test -s evaluation.html
          test -s styles.css
          test -s education.css
          test -s evaluation.css
          test -s a11y-check.js
          test -s imsmanifest.xml
          test -s dist/buildbench-scorm-1.2.zip
          test -s favicon.svg
          grep -q 'id="pc-view"' index.html
          grep -q 'id="port-view"' index.html
          grep -q 'id="lesson-dialog"' index.html
          grep -q 'id="network-options"' index.html
          grep -q 'const categories' app.js
          grep -q 'const lessons' education.js
          grep -q 'generation-badge' app.js
          grep -q 'id:"b550m"' app.js
          grep -q 'id:"3080"' app.js
          grep -q 'buildbench-evaluation-v1' app.js
          grep -q 'id="scenario-grid"' evaluation.html
          grep -q 'const scenarios' evaluation.js
          grep -q 'adlcp:scormtype="sco"' imsmanifest.xml
      - name: SCORM-Paket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: buildbench-scorm-1.2
          path: dist/buildbench-scorm-1.2.zip
          if-no-files-found: error
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Statische Dateien paketieren
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
