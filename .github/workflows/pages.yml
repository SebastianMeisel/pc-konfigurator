name: GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Anwendung prüfen
        run: |
          node --check app.js
          node --check education.js
          test -s index.html
          test -s styles.css
          test -s education.css
          test -s favicon.svg
          grep -q 'id="pc-view"' index.html
          grep -q 'id="port-view"' index.html
          grep -q 'id="lesson-dialog"' index.html
          grep -q 'id="network-options"' index.html
          grep -q 'const categories' app.js
          grep -q 'const lessons' education.js
          grep -q 'generation-badge' app.js
          grep -q 'id:"b550m"' app.js
          grep -q 'id:"3080"' app.js
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Statische Dateien paketieren
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4