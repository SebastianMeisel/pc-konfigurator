name: GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Anwendung prüfen
        run: |
          node --check app.js
          node --check education.js
          node --check evaluation.js
          node --check quiz.js
          node --check quiz-check.js
          node --check scorm.js
          node --check svg-loader.js
          node --check content-loader.js
          node --check content-check.js
          node --check content-runtime-check.js
          node --check scorm-check.js
          node --check a11y-check.js
          node scorm-check.js
          node quiz-check.js
          node content-check.js
          node content-runtime-check.js
          node a11y-check.js
          node --check algorithmen-trainer/app.js
          node --check algorithmen-trainer/scorm.js
          node algorithmen-trainer/check.js
          python3 -m py_compile tools/quiz_xlsx.py tools/content_xlsx.py tools/package_scorm.py
          python3 -m py_compile algorithmen-trainer/tools/package_scorm.py
          content_roundtrip_dir=$(mktemp -d)
          python3 tools/content_xlsx.py export --xlsx "$content_roundtrip_dir/buildbench-content.xlsx"
          python3 tools/content_xlsx.py import --xlsx "$content_roundtrip_dir/buildbench-content.xlsx" --content-dir "$content_roundtrip_dir/content" --force
          node content-check.js "$content_roundtrip_dir/content"
          python3 tools/package_scorm.py --force
          unzip -t dist/buildbench-scorm-1.2.zip
          python3 algorithmen-trainer/tools/package_scorm.py --force
          unzip -t algorithmen-trainer/dist/algodesk-scorm-1.2.zip
          test -s index.html
          test -s evaluation.html
          test -s styles.css
          test -s education.css
          test -s evaluation.css
          test -s a11y-check.js
          test -s content-loader.js
          test -s content/components.json
          test -s content/lessons.json
          test -s content/network.json
          test -s content/compatibility-rules.json
          test -s buildbench-content.xlsx
          test -s imsmanifest.xml
          test -s assets/svg/inside-view.svg
          test -s assets/svg/ports-view.svg
          test -s dist/buildbench-scorm-1.2.zip
          test -s algorithmen-trainer/index.html
          test -s algorithmen-trainer/content/algorithms.json
          test -s algorithmen-trainer/content/exercises.json
          test -s algorithmen-trainer/dist/algodesk-scorm-1.2.zip
          test -s favicon.svg
          grep -q 'id="pc-view-host"' index.html
          grep -q 'id="port-view-host"' index.html
          grep -q 'id="pc-view"' assets/svg/inside-view.svg
          grep -q 'id="port-view"' assets/svg/ports-view.svg
          grep -q 'id="lesson-dialog"' index.html
          grep -q 'id="compatibility-dialog"' index.html
          grep -q 'id="network-options"' index.html
          grep -q 'BuildBenchContent?.ready' app.js
          grep -q 'BuildBenchContent?.ready' education.js
          grep -q 'generation-badge' app.js
          grep -q '"id": "b550m"' content/components.json
          grep -q '"id": "3080"' content/components.json
          grep -q 'buildbench-evaluation-v1' app.js
          grep -q 'id="scenario-grid"' evaluation.html
          grep -q 'const scenarios' evaluation.js
          grep -q 'adlcp:scormtype="sco"' imsmanifest.xml
      - name: SCORM-Paket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: buildbench-scorm-1.2
          path: dist/buildbench-scorm-1.2.zip
          if-no-files-found: error
      - name: AlgoDesk-SCORM-Paket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: algodesk-scorm-1.2
          path: algorithmen-trainer/dist/algodesk-scorm-1.2.zip
          if-no-files-found: error
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Statische Dateien paketieren
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
